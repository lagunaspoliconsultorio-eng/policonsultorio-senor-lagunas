<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Policonsultorio Señor de Lagunas</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#dff3fc;
}

@keyframes fadeInDown{
    from{opacity:0;transform:translate(-50%,-60%);}
    to{opacity:1;transform:translate(-50%,-50%);}
}

@keyframes flotar{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0px);}
}

@keyframes pulso{
    0%,100%{opacity:.6;transform:translateX(-50%) translateY(0);}
    50%{opacity:1;transform:translateX(-50%) translateY(5px);}
}

.principal{
    width:100%;
    height:100vh;
    min-height:650px;
    position:relative;
    overflow:hidden;
    background-image:
        linear-gradient(rgba(4,69,125,.3),rgba(0,30,60,.6)),
        url("fondo-clinica.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.principal::before{
    content:"";
    position:absolute;
    width:550px;
    height:550px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.15) 0%,transparent 70%);
    top:-200px;
    right:-150px;
}

.principal::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:250px;
    background:linear-gradient(transparent,rgba(0,25,50,.7));
    pointer-events:none;
}

.logo-principal{
    position:absolute;
    top:25px;
    left:30px;
    width:260px;
    height:auto;
    object-fit:contain;
    z-index:30;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,.4));
    transition:transform .3s ease;
}

.logo-principal:hover{
    transform:scale(1.03);
}

.menu-principal{
    position:absolute;
    left:38px;
    top:50%;
    transform:translateY(-50%);
    width:240px;
    padding:22px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.3);
    border-radius:24px;
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    box-shadow:0 15px 35px rgba(0,0,0,.2);
    display:flex;
    flex-direction:column;
    gap:12px;
    z-index:30;
}

.menu-principal::before{
    content:"MENÚ PRINCIPAL";
    display:block;
    text-align:center;
    color:rgba(255,255,255,.9);
    font-size:11px;
    font-weight:700;
    letter-spacing:2px;
    margin-bottom:5px;
}

.menu-principal a{
    width:100%;
    height:55px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    text-decoration:none;
    font-size:14px;
    font-weight:700;
    letter-spacing:1px;
    background:linear-gradient(135deg,rgba(7,85,160,.8),rgba(11,120,189,.8));
    border:1px solid rgba(255,255,255,.4);
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
    transition:all .4s cubic-bezier(.175,.885,.32,1.275);
}

.menu-principal a:hover{
    transform:translateX(10px) scale(1.02);
    background:linear-gradient(135deg,#0755A0,#1591c8);
    box-shadow:0 8px 25px rgba(11,120,189,.5);
    border:1px solid rgba(255,255,255,1);
}

.titulo{
    position:absolute;
    top:47%;
    left:61%;
    transform:translate(-50%,-50%);
    width:62%;
    text-align:center;
    z-index:20;
    animation:fadeInDown 1.2s ease-out forwards;
}

.titulo h1{
    color:#ffffff;
    font-size:clamp(45px,5.5vw,85px);
    line-height:1;
    font-weight:900;
    letter-spacing:4px;
    text-shadow:
        3px 3px 0 #0755A0,
        6px 6px 15px rgba(0,0,0,.4);
}

.linea-titulo{
    width:150px;
    height:5px;
    background:linear-gradient(90deg,transparent,#0b78bd,transparent);
    margin:25px auto 20px;
    border-radius:10px;
}

.subtitulo{
    color:#e6f7fd;
    font-size:22px;
    font-weight:300;
    letter-spacing:4px;
    text-shadow:2px 3px 8px rgba(0,0,0,.5);
}

.etiqueta{
    display:inline-block;
    margin-top:22px;
    padding:10px 24px;
    color:#ffffff;
    background:linear-gradient(135deg,#0755A0,#0b78bd);
    border:1px solid rgba(255,255,255,.5);
    border-radius:30px;
    font-size:13px;
    font-weight:700;
    letter-spacing:1px;
    box-shadow:0 8px 20px rgba(0,0,0,.3);
}

.info-principal{
    position:absolute;
    right:38px;
    bottom:40px;
    width:320px;
    padding:22px 25px;
    background:rgba(255,255,255,.95);
    border-left:5px solid #0755A0;
    border-radius:18px;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
    z-index:30;
    animation:flotar 4s ease-in-out infinite;
    backdrop-filter:blur(10px);
}

.info-principal h3{
    color:#0755A0;
    font-size:19px;
    margin-bottom:8px;
    font-weight:900;
}

.info-principal p{
    color:#52758e;
    font-size:14px;
    line-height:1.6;
}

.datos{
    display:flex;
    justify-content:space-between;
    margin-top:18px;
    padding-top:15px;
    border-top:1px solid rgba(7,85,160,.1);
}

.dato{
    color:#0755A0;
    font-size:12px;
    font-weight:800;
    line-height:1.3;
    text-align:center;
}

.dato span{
    font-size:20px;
    color:#0b78bd;
    display:block;
}

.indicador{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:rgba(255,255,255,.9);
    font-size:12px;
    font-weight:700;
    letter-spacing:2px;
    text-shadow:1px 2px 6px rgba(0,0,0,.5);
    z-index:35;
    animation:pulso 2s infinite;
}

@media(max-width:850px){
    .logo-principal{
        width:180px;
        top:20px;
        left:20px;
    }

    .menu-principal{
        left:50%;
        top:110px;
        transform:translateX(-50%);
        width:90%;
        padding:15px;
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:10px;
    }

    .menu-principal::before{
        grid-column:1/3;
    }

    .menu-principal a{
        height:50px;
        font-size:13px;
    }

    .titulo{
        left:50%;
        top:55%;
        width:92%;
        transform:translate(-50%,-40%);
    }

    .titulo h1{
        font-size:42px;
    }

    .subtitulo{
        font-size:16px;
    }

    .info-principal{
        display:none;
    }

    .indicador{
        bottom:15px;
    }
}

@media(max-width:500px){
    .logo-principal{
        width:150px;
    }

    .menu-principal{
        top:95px;
        width:92%;
    }

    .menu-principal a{
        height:48px;
        font-size:12px;
    }

    .titulo{
        top:58%;
    }

    .titulo h1{
        font-size:34px;
        letter-spacing:2px;
    }

    .linea-titulo{
        width:100px;
        height:4px;
    }

    .subtitulo{
        font-size:13px;
    }

    .etiqueta{
        font-size:11px;
        padding:8px 16px;
    }
}
</style>
</head>

<body>

<section class="principal">

<img class="logo-principal" src="logo-clinicagrande.jpg" alt="Logo Policonsultorio">

<div class="menu-principal">

<a href="especialistas.html">ESPECIALISTAS</a>
<a href="nosotros.html">NOSOTROS</a>
<a href="citas.html">CITAS MEDICAS</a>
</div>

<div class="titulo">
<h1>
POLICONSULTORIO<br>
SEÑOR DE<br>
LAGUNAS
</h1>

<div class="linea-titulo"></div>

<div class="subtitulo">
    TU SALUD ES PRIORIDAD
</div>

<div class="etiqueta">
ATENCIÓN MÉDICA DE CALIDAD
</div>
</div>

<div class="info-principal">
<h3>Atención profesional</h3>

<p>
Brindamos atención cercana, segura y de calidad,
pensada para el bienestar de cada paciente
</p>

<div class="datos">
<div class="dato"><span>+10</span>ESPECIALIDADES</div>
<div class="dato"><span>100%</span>COMPROMISO</div>
</div>
</div>

</section>

</body>
</html>
